<!DOCTYPE html>
<html lang="it" class="h-full bg-slate-950 text-slate-100 select-none overflow-hidden">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Segnapunti Biliardo Semplice</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Inter e Oswald (Puliti, Moderni, Leggibili da lontano) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Oswald:wght@700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
                        number: ['Oswald', 'Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #090c10;
        }
        button {
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        .glow-green {
            box-shadow: 0 0 35px rgba(16, 185, 129, 0.15);
        }
        .glow-blue {
            box-shadow: 0 0 35px rgba(6, 182, 212, 0.15);
        }
    </style>
</head>
<body class="h-full flex flex-col justify-between font-sans text-slate-100 p-3 sm:p-5 overflow-hidden">

    <!-- TIMER / HEADER CENTRALE -->
    <header class="bg-slate-900/90 border border-slate-800 rounded-2xl px-6 py-2.5 flex items-center justify-between shadow-xl shrink-0">
        <div class="text-xs uppercase font-extrabold tracking-widest text-slate-400">
            Tempo Match
        </div>

        <!-- Cronometro Pulito -->
        <div class="flex items-center space-x-4">
            <span id="timerDisplay" class="font-number text-3xl sm:text-4xl font-bold text-emerald-400 tracking-wider">00:00</span>
            <div class="flex items-center space-x-2">
                <button onclick="toggleTimer()" id="timerToggleBtn" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 font-bold px-4 py-2 rounded-xl text-sm transition active:scale-95 flex items-center space-x-2">
                    <i class="fa-solid fa-play text-emerald-400 text-xs" id="timerIcon"></i>
                    <span id="timerStatusText">Avvia</span>
                </button>
                <button onclick="resetTimer()" title="Azzera Timer" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-400 hover:text-slate-200 p-2.5 rounded-xl transition active:scale-95">
                    <i class="fa-solid fa-rotate-right text-xs"></i>
                </button>
            </div>
        </div>

        <div class="text-xs font-extrabold text-slate-500 uppercase tracking-widest">
            Biliardo Scoreboard
        </div>
    </header>

    <!-- AREA GIOCATORI / PUNTI / SET -->
    <main class="flex-1 grid grid-cols-2 gap-4 my-3 min-h-0">
        
        <!-- GIOCATORE 1 -->
        <section class="flex flex-col justify-between bg-slate-900/80 border-2 border-emerald-500/50 rounded-3xl p-4 sm:p-5 shadow-2xl glow-green">
            
            <!-- Nome Giocatore 1 -->
            <div class="flex items-center justify-between border-b border-slate-800/80 pb-2.5">
                <div class="flex items-center space-x-2 flex-1">
                    <button onclick="editPlayerName(1)" class="text-slate-500 hover:text-emerald-400 transition">
                        <i class="fa-solid fa-pen-to-square text-sm"></i>
                    </button>
                    <span id="p1Name" onclick="editPlayerName(1)" class="font-black text-2xl sm:text-3xl text-slate-100 truncate cursor-pointer tracking-tight">Giocatore 1</span>
                </div>
            </div>

            <!-- Display Punti ENORME e Pulito -->
            <div class="flex-1 flex flex-col items-center justify-center my-1">
                <div id="p1Score" class="font-number text-9xl sm:text-[10rem] font-bold text-emerald-400 leading-none tracking-tight">
                    0
                </div>
            </div>

            <!-- Controlli Punti P1 (+1, +2, -1) -->
            <div class="grid grid-cols-3 gap-2 sm:gap-3 mb-4">
                <button onclick="addPoints(1, 1)" class="py-4 bg-emerald-600 hover:bg-emerald-500 text-white font-black text-3xl sm:text-4xl rounded-2xl active:scale-95 transition shadow-lg flex items-center justify-center">
                    +1
                </button>
                <button onclick="addPoints(1, 2)" class="py-4 bg-emerald-700 hover:bg-emerald-600 text-emerald-100 font-black text-3xl sm:text-4xl rounded-2xl active:scale-95 transition shadow-lg flex items-center justify-center">
                    +2
                </button>
                <button onclick="addPoints(1, -1)" class="py-4 bg-slate-800 hover:bg-slate-700 border border-slate-700/80 text-slate-300 font-extrabold text-xl sm:text-2xl rounded-2xl active:scale-95 transition flex items-center justify-center">
                    -1
                </button>
            </div>

            <!-- Sezione SET P1 -->
            <div class="bg-slate-950/90 border border-slate-800 rounded-2xl p-3 flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <span class="text-xs uppercase font-extrabold text-slate-400 tracking-widest">SET:</span>
                    <span id="p1Sets" class="font-number font-bold text-3xl text-amber-400">0</span>
                </div>
                <div class="flex items-center space-x-2">
                    <button onclick="addSet(1, -1)" class="w-10 h-10 bg-slate-800 hover:bg-slate-700 text-slate-300 font-black rounded-xl text-lg flex items-center justify-center border border-slate-700 active:scale-95">
                        -
                    </button>
                    <button onclick="addSet(1, 1)" class="px-4 h-10 bg-amber-500 hover:bg-amber-400 text-slate-950 font-black rounded-xl text-xs sm:text-sm flex items-center justify-center shadow transition active:scale-95 uppercase tracking-wider">
                        +1 SET
                    </button>
                </div>
            </div>

        </section>

        <!-- GIOCATORE 2 -->
        <section class="flex flex-col justify-between bg-slate-900/80 border-2 border-cyan-500/50 rounded-3xl p-4 sm:p-5 shadow-2xl glow-blue">
            
            <!-- Nome Giocatore 2 -->
            <div class="flex items-center justify-between border-b border-slate-800/80 pb-2.5">
                <div class="flex items-center space-x-2 flex-1">
                    <button onclick="editPlayerName(2)" class="text-slate-500 hover:text-cyan-400 transition">
                        <i class="fa-solid fa-pen-to-square text-sm"></i>
                    </button>
                    <span id="p2Name" onclick="editPlayerName(2)" class="font-black text-2xl sm:text-3xl text-slate-100 truncate cursor-pointer tracking-tight">Giocatore 2</span>
                </div>
            </div>

            <!-- Display Punti ENORME e Pulito -->
            <div class="flex-1 flex flex-col items-center justify-center my-1">
                <div id="p2Score" class="font-number text-9xl sm:text-[10rem] font-bold text-cyan-400 leading-none tracking-tight">
                    0
                </div>
            </div>

            <!-- Controlli Punti P2 (+1, +2, -1) -->
            <div class="grid grid-cols-3 gap-2 sm:gap-3 mb-4">
                <button onclick="addPoints(2, 1)" class="py-4 bg-cyan-600 hover:bg-cyan-500 text-white font-black text-3xl sm:text-4xl rounded-2xl active:scale-95 transition shadow-lg flex items-center justify-center">
                    +1
                </button>
                <button onclick="addPoints(2, 2)" class="py-4 bg-cyan-700 hover:bg-cyan-600 text-cyan-100 font-black text-3xl sm:text-4xl rounded-2xl active:scale-95 transition shadow-lg flex items-center justify-center">
                    +2
                </button>
                <button onclick="addPoints(2, -1)" class="py-4 bg-slate-800 hover:bg-slate-700 border border-slate-700/80 text-slate-300 font-extrabold text-xl sm:text-2xl rounded-2xl active:scale-95 transition flex items-center justify-center">
                    -1
                </button>
            </div>

            <!-- Sezione SET P2 -->
            <div class="bg-slate-950/90 border border-slate-800 rounded-2xl p-3 flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <span class="text-xs uppercase font-extrabold text-slate-400 tracking-widest">SET:</span>
                    <span id="p2Sets" class="font-number font-bold text-3xl text-amber-400">0</span>
                </div>
                <div class="flex items-center space-x-2">
                    <button onclick="addSet(2, -1)" class="w-10 h-10 bg-slate-800 hover:bg-slate-700 text-slate-300 font-black rounded-xl text-lg flex items-center justify-center border border-slate-700 active:scale-95">
                        -
                    </button>
                    <button onclick="addSet(2, 1)" class="px-4 h-10 bg-amber-500 hover:bg-amber-400 text-slate-950 font-black rounded-xl text-xs sm:text-sm flex items-center justify-center shadow transition active:scale-95 uppercase tracking-wider">
                        +1 SET
                    </button>
                </div>
            </div>

        </section>

    </main>

    <!-- FOOTER AZIONI RAPIDE -->
    <footer class="bg-slate-900/90 border border-slate-800 rounded-2xl px-6 py-2.5 flex items-center justify-between shrink-0">
        <!-- Reset Nuova Partita -->
        <button onclick="confirmReset()" class="bg-red-950/80 hover:bg-red-900 border border-red-800/80 text-red-200 font-extrabold px-5 py-2.5 rounded-xl text-xs uppercase tracking-wider flex items-center space-x-2 transition active:scale-95">
            <i class="fa-solid fa-rotate-right"></i>
            <span>Nuova Partita</span>
        </button>

        <!-- Fullscreen Button -->
        <button onclick="toggleFullscreen()" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 font-extrabold px-5 py-2.5 rounded-xl text-xs uppercase tracking-wider flex items-center space-x-2 transition active:scale-95">
            <i class="fa-solid fa-expand"></i>
            <span>Schermo Intero</span>
        </button>
    </footer>

    <!-- MODALE CONFERMA RESET -->
    <div id="resetModal" class="fixed inset-0 bg-slate-950/85 backdrop-blur-sm z-50 flex items-center justify-center hidden">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl w-11/12 max-w-sm p-6 text-center shadow-2xl">
            <div class="w-14 h-14 bg-red-950 text-red-400 rounded-2xl flex items-center justify-center mx-auto mb-4 text-2xl border border-red-800">
                <i class="fa-solid fa-triangle-exclamation"></i>
            </div>
            <h3 class="text-xl font-extrabold text-slate-100 mb-2">Nuova Partita?</h3>
            <p class="text-xs text-slate-400 mb-6">Punti, set e il timer verranno completamente azzerati.</p>

            <div class="flex space-x-3">
                <button onclick="closeResetModal()" class="px-4 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 font-extrabold rounded-xl flex-1 text-xs uppercase tracking-wider">Annulla</button>
                <button onclick="executeReset()" class="px-4 py-2.5 bg-red-600 hover:bg-red-500 text-white font-extrabold rounded-xl flex-1 shadow-lg text-xs uppercase tracking-wider">Azzera</button>
            </div>
        </div>
    </div>

    <!-- LOGICA JAVASCRIPT -->
    <script>
        // Stato della Partita
        let state = {
            p1: { name: "Giocatore 1", score: 0, sets: 0 },
            p2: { name: "Giocatore 2", score: 0, sets: 0 }
        };

        // Timer
        let secondsElapsed = 0;
        let timerInterval = null;
        let isTimerRunning = false;

        // Web Audio API per effetto sonoro sintetico al tocco
        let audioCtx = null;
        function playTouchSound() {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(520, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.05);
                
                gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
                
                osc.start(audioCtx.currentTime);
                osc.stop(audioCtx.currentTime + 0.05);
            } catch (e) {
                // Audio fallback silenzioso se bloccato dal browser
            }
        }

        // Modifica Punti
        function addPoints(player, delta) {
            playTouchSound();
            if (player === 1) {
                state.p1.score = Math.max(0, state.p1.score + delta);
            } else {
                state.p2.score = Math.max(0, state.p2.score + delta);
            }
            updateUI();
        }

        // Modifica Set
        function addSet(player, delta) {
            playTouchSound();
            if (player === 1) {
                state.p1.sets = Math.max(0, state.p1.sets + delta);
                if (delta > 0) state.p1.score = 0; // Azzera i punti al vincitore del set
            } else {
                state.p2.sets = Math.max(0, state.p2.sets + delta);
                if (delta > 0) state.p2.score = 0; // Azzera i punti al vincitore del set
            }
            updateUI();
        }

        // Modifica Nome Giocatore
        function editPlayerName(player) {
            const current = player === 1 ? state.p1.name : state.p2.name;
            const newName = prompt(`Inserisci il nome per il Giocatore ${player}:`, current);
            if (newName && newName.trim() !== "") {
                if (player === 1) state.p1.name = newName.trim();
                else state.p2.name = newName.trim();
                updateUI();
            }
        }

        // Aggiorna Grafica
        function updateUI() {
            document.getElementById('p1Score').innerText = state.p1.score;
            document.getElementById('p2Score').innerText = state.p2.score;
            document.getElementById('p1Sets').innerText = state.p1.sets;
            document.getElementById('p2Sets').innerText = state.p2.sets;
            document.getElementById('p1Name').innerText = state.p1.name;
            document.getElementById('p2Name').innerText = state.p2.name;
        }

        // Timer Logic
        function toggleTimer() {
            playTouchSound();
            isTimerRunning = !isTimerRunning;
            const icon = document.getElementById('timerIcon');
            const statusText = document.getElementById('timerStatusText');

            if (isTimerRunning) {
                icon.className = "fa-solid fa-pause text-amber-400";
                statusText.innerText = "Pausa";
                if (!timerInterval) {
                    timerInterval = setInterval(() => {
                        secondsElapsed++;
                        renderTimer();
                    }, 1000);
                }
            } else {
                icon.className = "fa-solid fa-play text-emerald-400";
                statusText.innerText = "Avvia";
                if (timerInterval) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                }
            }
        }

        function resetTimer() {
            playTouchSound();
            secondsElapsed = 0;
            renderTimer();
        }

        function renderTimer() {
            const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
            const secs = String(secondsElapsed % 60).padStart(2, '0');
            document.getElementById('timerDisplay').innerText = `${mins}:${secs}`;
        }

        // Modal Reset Partita
        function confirmReset() {
            playTouchSound();
            document.getElementById('resetModal').classList.remove('hidden');
        }

        function closeResetModal() {
            document.getElementById('resetModal').classList.add('hidden');
        }

        function executeReset() {
            state.p1.score = 0;
            state.p2.score = 0;
            state.p1.sets = 0;
            state.p2.sets = 0;
            secondsElapsed = 0;
            renderTimer();
            if (isTimerRunning) toggleTimer();
            closeResetModal();
            updateUI();
        }

        // Fullscreen
        function toggleFullscreen() {
            playTouchSound();
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }
    </script>
</body>
</html>
